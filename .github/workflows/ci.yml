name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: py${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable, dev extra)
        run: python -m pip install -e ".[dev]"

      - name: Sprint layout gate (methodology binding)
        run: python tools/check_sprint_layout.py

      - name: Layout gate mutation verification
        run: python tools/verify_layout_gate.py

      - name: Scaffold selftest (single-source checks)
        run: python tools/scaffold_selftest.py

      - name: Tests
        run: python -m pytest

      - name: CLI smoke (console entry point)
        run: anonymity-scanner --version
